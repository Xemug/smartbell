[project]
name = "smartbell-api"
version = "0.1.0"
description = "Smartbell API: FastAPI + SQLAlchemy 2 + Alembic on PostgreSQL."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartbell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.importlinter]
root_package = "smartbell"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The domain does no I/O"
type = "forbidden"
source_modules = ["smartbell.domain"]
forbidden_modules = [
    "smartbell.db",
    "smartbell.models",
    "smartbell.routes",
    "smartbell.services",
    "smartbell.settings",
    "alembic",
    "asyncpg",
    "fastapi",
    "httpx",
    "sqlalchemy",
    "uvicorn",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["smartbell", "migrations", "tests"]
