# Local PostgreSQL 16 for app/api. POSTGRES_PORT moves it off 5432 if that port is taken.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smartbell
      POSTGRES_PASSWORD: smartbell
      POSTGRES_DB: smartbell
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbell -d smartbell"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
